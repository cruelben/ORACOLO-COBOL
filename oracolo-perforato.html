<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORACOLO PERFORATO</title>
<style>
  :root {
    --bg: #150f08;
    --amber: #ffb000;
    --amber-dim: #6b4b00;
    --card: #e4d8b4;
    --card-shadow: #b8a878;
    --card-ink: #2b2116;
    --card-hole: #150f08;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,176,0,0.06), transparent 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Courier New', 'Lucida Console', monospace;
  }

  .console {
    width: 100%;
    max-width: 640px;
  }

  .boot {
    color: var(--amber-dim);
    font-size: 12px;
    line-height: 1.8;
    letter-spacing: 0.5px;
    margin-bottom: 18px;
    min-height: 90px;
  }

  .boot .ready {
    color: var(--amber);
  }

  button#punchBtn {
    display: block;
    margin: 0 auto 30px auto;
    background: none;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 10px 20px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  button#punchBtn:hover {
    background: var(--amber);
    color: #1a1206;
  }

  button#punchBtn:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
  }

  button#punchBtn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* --- The punch card --- */
  .card-wrap {
    perspective: 800px;
  }

  .card {
    position: relative;
    background: var(--card);
    color: var(--card-ink);
    width: 100%;
    aspect-ratio: 7.375 / 3.25;
    border-radius: 3px;
    box-shadow:
      0 10px 0 -4px var(--card-shadow),
      0 18px 30px rgba(0,0,0,0.55);
    clip-path: polygon(
      0 28px, 28px 0,
      100% 0, 100% 100%, 0 100%
    );
    padding: 18px 20px 14px 20px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 1px;
    color: #6b5f45;
    border-bottom: 1px solid #b8a878;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }

  .hole-row {
    display: flex;
    gap: 3px;
    margin-bottom: 3px;
  }

  .hole {
    width: 6px;
    height: 9px;
    background: transparent;
    border-radius: 1px;
    flex-shrink: 0;
  }

  .hole.punched {
    background: var(--card-hole);
    box-shadow: inset 0 0 2px rgba(0,0,0,0.6);
  }

  .card-text {
    margin-top: 14px;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.5;
    min-height: 3.2em;
    letter-spacing: 0.3px;
  }

  .card-footer {
    position: absolute;
    bottom: 10px;
    right: 20px;
    font-size: 9px;
    color: #8a7c5c;
    letter-spacing: 1px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }

  footer.credit {
    text-align: center;
    color: var(--amber-dim);
    font-size: 11px;
    margin-top: 22px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="console">
  <div class="boot" id="bootLog"></div>

  <button id="punchBtn" type="button" disabled>PERFORA LA SCHEDA</button>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="card-header">
        <span>ORACOLO PERFORATO</span>
        <span id="cardNum">SCHEDA 00/08</span>
      </div>
      <div class="hole-row" id="holeRow1"></div>
      <div class="hole-row" id="holeRow2"></div>
      <div class="card-text" id="cardText">&nbsp;</div>
      <div class="card-footer">IBM 029 EMULATION</div>
    </div>
  </div>
</div>

<footer class="credit">porting HTML dell'originale COBOL — nessuna scheda e' stata realmente perforata</footer>

<script>
  const FRASI = [
    "IL TUO CODICE COMPILERA' AL PRIMO COLPO",
    "UN GOTO TI ASPETTA DIETRO L'ANGOLO",
    "TROVERAI UN PUNTO E VIRGOLA MANCANTE",
    "IL DESTINO E' SCRITTO SU SCHEDA PERFORATA",
    "UN COBOL PROGRAMMER NON MUORE, RESTA IN PROD",
    "ATTENTO: RISCHIO DI ABEND IMMINENTE",
    "LA TUA FORTUNA E' IN BATCH, RIPROVA STASERA",
    "UN CICLO PERFORM TI PORTERA' LONTANO"
  ];

  const bootLog = document.getElementById('bootLog');
  const punchBtn = document.getElementById('punchBtn');
  const card = document.getElementById('card');
  const cardText = document.getElementById('cardText');
  const cardNum = document.getElementById('cardNum');
  const holeRow1 = document.getElementById('holeRow1');
  const holeRow2 = document.getElementById('holeRow2');

  const BOOT_LINES = [
    "INIZIALIZZAZIONE LETTORE SCHEDE...",
    "CARICAMENTO ORACOLO-PERFORATO.EXE...",
    "MEMORIA: 64K DISPONIBILI...",
    "PRONTO."
  ];

  function buildHoles(count) {
    for (let i = 0; i < 40; i++) {
      const h1 = document.createElement('span');
      h1.className = 'hole';
      const h2 = document.createElement('span');
      h2.className = 'hole';
      if (i < count) {
        h1.classList.add('punched');
        if (i % 3 === 0) h2.classList.add('punched');
      }
      holeRow1.appendChild(h1);
      holeRow2.appendChild(h2);
    }
  }
  buildHoles(0);

  function typeBoot(lines, i = 0) {
    if (i >= lines.length) {
      punchBtn.disabled = false;
      punchBtn.focus();
      return;
    }
    const line = document.createElement('div');
    if (i === lines.length - 1) line.classList.add('ready');
    bootLog.appendChild(line);
    let c = 0;
    const iv = setInterval(() => {
      line.textContent = lines[i].slice(0, c + 1);
      c++;
      if (c >= lines[i].length) {
        clearInterval(iv);
        setTimeout(() => typeBoot(lines, i + 1), 180);
      }
    }, 18);
  }

  let cardCount = 0;

  function punch() {
    const idx = Math.floor(Math.random() * FRASI.length);
    cardCount = (cardCount % 8) + 1;

    card.classList.remove('visible');
    void card.offsetWidth; // restart transition

    cardNum.textContent = `SCHEDA ${String(cardCount).padStart(2, '0')}/08`;
    cardText.textContent = FRASI[idx];

    holeRow1.innerHTML = '';
    holeRow2.innerHTML = '';
    buildHoles(FRASI[idx].length);

    requestAnimationFrame(() => card.classList.add('visible'));
  }

  punchBtn.addEventListener('click', punch);
  typeBoot(BOOT_LINES);
</script>

</body>
</html>
